<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification"
          content="8NjN5s_GvhyhwBf4PJ6rl62ydflUQydyNQlcAncuNzc" />

    <title>Noah Robot ID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #172554 0%, #020617 45%, #000 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 25px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.35);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            min-height: 22px;
            font-size: 14px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .info {
            color: #94a3b8;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 34px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">N</div>

        <h1>Noah</h1>

        <div class="subtitle">
            Student Guidance Robot
        </div>

        <div class="card">

            <h2>Enter Robot ID</h2>

            <p>
                Enter the Robot ID provided with your Noah robot.
            </p>

            <input
                type="text"
                id="robotId"
                placeholder="Enter Robot ID"
                autocomplete="off"
            >

            <button
                id="searchButton"
                onclick="findRobot()">
                Verify Robot
            </button>

            <div id="status"></div>

        </div>

        <div class="footer">
            Noah Robot Project © 2026
        </div>

    </div>

    <script>
        async function findRobot() {

            const input = document.getElementById("robotId");
            const button = document.getElementById("searchButton");
            const status = document.getElementById("status");

            let enteredId = input.value.trim();

            if (!enteredId) {
                status.textContent = "Please enter a Robot ID.";
                status.className = "error";
                return;
            }

            // Automatically add # if the user doesn't enter it
            if (!enteredId.startsWith("#")) {
                enteredId = "#" + enteredId;
            }

            enteredId = enteredId.toUpperCase();

            button.disabled = true;

            status.textContent = "Checking Robot ID...";
            status.className = "info";

            try {

                const response = await fetch(
                    "./robot_id.txt?cache=" + Date.now()
                );

                if (!response.ok) {
                    throw new Error("Robot ID file could not be loaded.");
                }

                const storedId = (await response.text())
                    .replace(/^\uFEFF/, "")
                    .trim()
                    .toUpperCase();

                console.log("Entered Robot ID:", enteredId);
                console.log("Stored Robot ID:", storedId);

                if (enteredId === storedId) {

                    status.textContent =
                        "Robot ID verified. Opening Noah...";

                    status.className = "success";

                    setTimeout(function () {
                        window.location.href = "./web.html";
                    }, 700);

                } else {

                    status.textContent =
                        "Robot ID not found.";

                    status.className = "error";
                }

            } catch (error) {

                console.error(
                    "Robot ID verification error:",
                    error
                );

                status.textContent =
                    "Unable to verify Robot ID.";

                status.className = "error";

            } finally {

                button.disabled = false;

            }
        }

        document
            .getElementById("robotId")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    findRobot();
                }

            });
    </script>

</body>
</html>
