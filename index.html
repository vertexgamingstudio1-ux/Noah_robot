<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="google-site-verification"
        content="8NjN5s_GvhyhwBf4PJ6rl62ydflUQydyNQlcAncuNzc"
    />

    <title>Noah Robot ID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172033 0%,
                    #080b12 45%,
                    #050609 100%
                );

            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 42px 34px;

            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;

            background: rgba(15, 19, 29, 0.92);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45);

            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;

            background: #ffffff;
            color: #080b12;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .description {
            color: #aeb7c7;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        input {
            flex: 1;
            min-width: 0;

            padding: 15px 16px;

            border-radius: 12px;
            border: 1px solid #303848;

            outline: none;

            background: #0a0d14;
            color: white;

            font-size: 16px;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            padding: 15px 22px;

            border: none;
            border-radius: 12px;

            background: white;
            color: #080b12;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(255,255,255,0.15);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #status {
            min-height: 24px;

            color: #aeb7c7;

            font-size: 14px;
        }

        .success {
            color: #72e6a4 !important;
        }

        .error {
            color: #ff7777 !important;
        }

        .info {
            margin-top: 28px;
            padding-top: 20px;

            border-top:
                1px solid rgba(255,255,255,0.08);

            color: #737d90;

            font-size: 13px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 34px 22px;
            }

            .input-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">N</div>

        <h1>Noah Robot ID</h1>

        <p class="description">
            Enter your Noah Robot ID to continue to the robot's page.
        </p>

        <div class="input-box">

            <input
                type="text"
                id="robotId"
                placeholder="Enter robot ID written in manual"
                autocomplete="off"
                maxlength="50"
            >

            <button
                id="searchButton"
                onclick="findRobot()"
            >
                Search
            </button>

        </div>

        <div id="status"></div>

        <div class="info">
            Noah Robot System
        </div>

    </main>


    <script>

        async function findRobot() {

            const input =
                document.getElementById("robotId");

            const button =
                document.getElementById("searchButton");

            const status =
                document.getElementById("status");


            let enteredId =
                input.value.trim();


            // --------------------------------
            // CHECK EMPTY INPUT
            // --------------------------------

            if (!enteredId) {

                status.textContent =
                    "Please enter a Robot ID.";

                status.className = "error";

                return;
            }


            // --------------------------------
            // ADD # AUTOMATICALLY
            // --------------------------------

            if (!enteredId.startsWith("#")) {

                enteredId =
                    "#" + enteredId;
            }


            // Normalize ID
            enteredId =
                enteredId.toUpperCase();


            // --------------------------------
            // UI STATE
            // --------------------------------

            button.disabled = true;

            status.textContent =
                "Checking Robot ID...";

            status.className = "";


            try {

                // --------------------------------
                // SECURE BACKEND CHECK
                // --------------------------------
                //
                // The valid Robot IDs are stored
                // privately on the server.
                //
                // The browser NEVER receives
                // robot_id.txt or the ID list.
                //
                // --------------------------------

                const response =
                    await fetch("/check-robot", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            robot_id: enteredId
                        })
                    });


                // Try to read JSON response
                const result =
                    await response.json();


                // --------------------------------
                // VALID ROBOT
                // --------------------------------

                if (result.valid) {

                    status.textContent =
                        "Robot ID verified. Opening Noah...";

                    status.className =
                        "success";


                    // Open robot page
                    setTimeout(function () {

                        window.location.href =
                            "./web.html";

                    }, 700);


                }

                // --------------------------------
                // INVALID ROBOT
                // --------------------------------

                else {

                    status.textContent =
                        "Robot ID not found.";

                    status.className =
                        "error";
                }


            } catch (error) {

                console.error(
                    "Robot ID verification error:",
                    error
                );


                status.textContent =
                    "Unable to verify Robot ID.";

                status.className =
                    "error";
            }


            // --------------------------------
            // ENABLE BUTTON AGAIN
            // --------------------------------

            finally {

                button.disabled = false;
            }
        }


        // --------------------------------
        // ENTER KEY SUPPORT
        // --------------------------------

        document
            .getElementById("robotId")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        findRobot();
                    }

                }
            );

    </script>

</body>
</html>
