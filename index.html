<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="o2NznCQl-W8lJ2FkMJJm9xBXRG_c7rdFpWP2AjnVbwg" />
    <title>Noah Robot ID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #172033 0%, #080b12 45%, #050609 100%);
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 42px 34px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            background: rgba(15, 19, 29, 0.92);
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            background: #ffffff;
            color: #080b12;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .description {
            color: #aeb7c7;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 15px 16px;
            border-radius: 12px;
            border: 1px solid #303848;
            outline: none;
            background: #0a0d14;
            color: white;
            font-size: 16px;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            padding: 15px 22px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #080b12;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,255,255,0.15);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #status {
            min-height: 24px;
            color: #aeb7c7;
            font-size: 14px;
        }

        .success {
            color: #72e6a4 !important;
        }

        .error {
            color: #ff7777 !important;
        }

        .info {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: #737d90;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 34px 22px;
            }

            .input-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">N</div>

        <h1>Noah Robot ID</h1>

        <p class="description">
            Enter your Noah Robot ID to continue to the robot's page.
        </p>

        <div class="input-box">

            <input
                type="text"
                id="robotId"
                placeholder="Enter robot ID written in manual"
                autocomplete="off"
                maxlength="50"
            >

            <button id="searchButton" onclick="findRobot()">
                Search
            </button>

        </div>

        <div id="status"></div>

        <div class="info">
            Noah Robot System
        </div>

    </main>

    <script>

        async function findRobot() {

            const input = document.getElementById("robotId");
            const button = document.getElementById("searchButton");
            const status = document.getElementById("status");

            let enteredId = input.value.trim();

            if (!enteredId) {
                status.textContent = "Please enter a Robot ID.";
                status.className = "error";
                return;
            }

            // Add # automatically if the user did not type it.
            if (!enteredId.startsWith("#")) {
                enteredId = "#" + enteredId;
            }

            button.disabled = true;
            status.textContent = "Checking Robot ID...";
            status.className = "";

            try {

                /*
                 * robot_id.txt is in the SAME folder as index.html
                 *
                 * Folder:
                 *
                 * noah-website/
                 * ├── index.html
                 * ├── web.html
                 * ├── robot_id.txt
                 * └── Noah_robot.zip
                 */

                const response = await fetch("./robot_id.txt?cache=" + Date.now());

                if (!response.ok) {
                    throw new Error(
                        "robot_id.txt could not be loaded. HTTP " + response.status
                    );
                }

                let fileText = await response.text();

                // Remove BOM/invisible characters and whitespace.
                let storedId = fileText
                    .replace(/^\uFEFF/, "")
                    .trim();

                // Normalize both IDs.
                enteredId = enteredId.trim().toUpperCase();
                storedId = storedId.trim().toUpperCase();

                console.log("Entered ID:", enteredId);
                console.log("Stored ID:", storedId);

                if (enteredId === storedId) {

                    status.textContent =
                        "Robot ID verified. Opening Noah...";

                    status.className = "success";

                    /*
                     * IMPORTANT:
                     * web.html is directly beside this index.html.
                     */
                    setTimeout(function () {
                        window.location.href = "./web.html";
                    }, 700);

                } else {

                    status.textContent =
                        "Robot ID not found.";

                    status.className = "error";
                }

            } catch (error) {

                console.error("Robot ID error:", error);

                status.textContent =
                    "Unable to check robot_id.txt.";

                status.className = "error";

            } finally {

                button.disabled = false;
            }
        }

        // Allow Enter key.
        document
            .getElementById("robotId")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    findRobot();
                }

            });

    </script>

</body>
</html>
