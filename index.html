<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification"
          content="8NjN5s_GvhyhwBf4PJ6rl62ydflUQydyNQlcAncuNzc">

    <title>Noah Robot Access</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f14;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #8f9aa6;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .card {
            background: #111820;
            border: 1px solid #26303b;
            border-radius: 18px;
            padding: 35px;
        }

        .card h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #aeb7c2;
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;

            border-radius: 10px;
            border: 1px solid #303b47;

            background: #0b0f14;
            color: white;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667585;
        }

        button {
            width: 100%;
            margin-top: 15px;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            min-height: 24px;

            margin-top: 20px;

            font-size: 14px;
        }

        .success {
            color: #72e6a1;
        }

        .error {
            color: #ff7d7d;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #59636e;
            font-size: 12px;
        }

        @media (max-width: 500px) {

            .card {
                padding: 25px;
            }

            .logo {
                font-size: 36px;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Noah
        </div>

        <div class="subtitle">
            Robot Access
        </div>


        <div class="card">

            <h1>
                Enter Robot ID
            </h1>

            <p class="description">
                Enter the Robot ID associated with your Noah system
                to continue.
            </p>


            <input
                type="text"
                id="robotId"
                placeholder="Enter Robot ID"
                autocomplete="off"
            >


            <button
                id="verifyButton"
                onclick="verifyRobot()">
                Verify Robot ID
            </button>


            <div id="status"></div>

        </div>


        <div class="footer">
            Noah Robot Project
        </div>

    </div>


    <script>

        async function verifyRobot() {
    const input = document.getElementById("robotId").value.trim();
    const status = document.getElementById("status");

    if (!input) {
        status.textContent = "Please enter a Robot ID.";
        return;
    }

    try {
        const response = await fetch(
            "./robot_id.txt?cache=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Could not load Robot IDs.");
        }

        const text = await response.text();

        const validIds = text
            .split(/\r?\n/)
            .map(id => id.trim().toUpperCase())
            .filter(id => id.length > 0);

        if (validIds.includes(input.toUpperCase())) {
            status.textContent = "Robot ID verified.";
            window.location.href = "./web.html";
        } else {
            status.textContent = "Invalid Robot ID.";
        }

    } catch (error) {
        console.error(error);
        status.textContent = "Verification system error.";
    }
}

        document
            .getElementById("robotId")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        verifyRobot();

                    }

                }
            );

    </script>

</body>
</html>
